name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: 22


      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: 22


      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type-check
        run: bun run type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: 22


      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test
